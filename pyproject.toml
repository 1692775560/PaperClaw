[project]
name = "paperclaw"
version = "1.0.0"
description = "PaperClaw — 面向学术科研工作者的高能动性AI自动化辅助系统。大脑(LLM决策引擎) + 手脚(Skill插件执行层) + 记忆(Memory知识管理)三层协同架构。"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "arxiv>=2.1",
    "numpy>=1.24",
]
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
anthropic = ["httpx>=0.24"]
web = ["scholarly>=1.7", "crawl4ai>=0.2", "tavily-python>=0.3"]
pdf = ["PyMuPDF>=1.23"]
all = [
    "httpx>=0.24",
    "scholarly>=1.7",
    "crawl4ai>=0.2",
    "tavily-python>=0.3",
    "PyMuPDF>=1.23",
    "huggingface-hub>=0.20",
    "matplotlib>=3.7",
    "scipy>=1.10",
]
dev = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
paperclaw = "paperclaw.cli:main"
researchclaw = "paperclaw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["paperclaw", "researchclaw", "sibyl", "arc"]

[tool.hatch.build.targets.wheel.force-include]
"paperclaw/templates/styles" = "paperclaw/templates/styles"
"researchclaw/templates/styles" = "researchclaw/templates/styles"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
